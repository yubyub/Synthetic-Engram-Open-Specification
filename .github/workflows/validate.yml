name: Validate specification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/conformance_harness.py --adapter implementations/python-engram/engram_adapter.py
  node-conformance:
    strategy:
      matrix:
        node-version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - run: python scripts/conformance_harness.py --adapter implementations/node-engram/engram-adapter.js
      - run: python scripts/run_interoperability.py
  development-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/run_frontmatter_tests.py
      - run: python scripts/run_lifecycle_tests.py
  engram-mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_engram_mesh_schema.py
      - run: python scripts/validate_engram_mesh.py
      - run: python scripts/validate_engram_mesh.py examples/v0.3/basic-mesh/engram-mesh.json
      - run: python scripts/run_engram_mesh_adapter_tests.py
